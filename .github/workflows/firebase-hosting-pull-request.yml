name: Deploy preview to Firebase Hosting on PR

on:
  # pull_request (not pull_request_target) so that forked PRs run without secrets
  # rather than running untrusted code with access to the deploy credentials.
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    # Forked PRs cannot read repository secrets, so the deploy step would fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build encodes audio-src/*.wav to AAC (scripts/encode-audio.mjs). Not assuming
      # ffmpeg is preinstalled on the runner image, since a missing one fails the build.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - run: bun install --frozen-lockfile

      - run: bun run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MKHAN_PLAY_AND_LEARN }}
          projectId: mkhan-play-and-learn
          expires: 7d
