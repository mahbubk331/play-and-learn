name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build encodes audio-src/*.wav to AAC (scripts/encode-audio.mjs). Not assuming
      # ffmpeg is preinstalled on the runner image, since a missing one fails the build.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - run: bun install --frozen-lockfile

      - run: bun run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MKHAN_PLAY_AND_LEARN }}
          channelId: live
          projectId: mkhan-play-and-learn
